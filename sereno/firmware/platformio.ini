; Sereno · firmware para LilyGO T-SIM7080G-S3 (ESP32-S3 N16R8 + SIM7080G + AXP2101)
;   pio run              compila
;   pio run -t upload    graba por USB
; El núcleo (lib/sereno_core) no depende de la placa:  make prueba  lo prueba en un PC.
[platformio]
default_envs = sereno

[env:sereno]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTINY_GSM_MODEM_SIM7080
  -DTINY_GSM_RX_BUFFER=1024
  -DXPOWERS_CHIP_AXP2101
; Versiones fijadas a propósito. El código está contrastado, llamada a llamada,
; con las fuentes de estas etiquetas. Las siguientes cambian la interfaz:
; XPowersLib 0.3 reorganiza la clase y TinyGSM posterior a 0.12 exige un
; «contexto SSL» para las conexiones seguras y renombra poweroff().
lib_deps =
  lewisxhe/XPowersLib@0.2.9
  vshymanskyy/TinyGSM@0.12.0
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit SHT4x Library@^1.0.5
  adafruit/Adafruit MLX90614 Library@^2.1.5
